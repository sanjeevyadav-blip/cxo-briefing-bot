name: Daily CXO Business Briefing

on:
  schedule:
    # 05:30 UTC = 11:00 IST (India doesn't observe DST, so this is stable
    # year-round). GitHub's scheduler can run a few minutes late during
    # peak load -- that's a documented GH Actions limitation, not a bug
    # in this workflow.
    - cron: "30 5 * * *"
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write   # lets the workflow commit the built page back to the repo

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (needed by pydub for MP3 export)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Piper voice models
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-voices-${{ hashFiles('config.yaml') }}

      - name: Layer 1 -- fetch news
        run: python scripts/fetch_news.py

      - name: Layer 2 -- rank & shortlist
        run: python scripts/rank_news.py

      - name: Layer 3 -- generate script (Groq, free tier -- not Claude)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_script.py

      - name: Layer 4 -- render audio (Piper, open source)
        run: python scripts/tts_render.py

      - name: Layer 6 -- build the web page (no email, no SMTP secrets)
        run: python scripts/build_page.py

      - name: Commit and push the updated page
        run: |
          git config user.name "cxo-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git commit -m "Daily briefing: $(date -u +%Y-%m-%d)" || echo "Nothing new to commit"
          git push

      - name: Upload episode as a workflow artifact too (30-day backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_id }}
          path: |
            output/episode.mp3
            data/show_notes.md
          retention-days: 30
