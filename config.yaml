# CXO Business Briefing Bot -- configuration
# Nothing secret lives here. Secrets (API keys) go in GitHub repo
# Settings -> Secrets and variables -> Actions.

rss_feeds:
  # Free, public RSS -- verify these still resolve before your first run;
  # publications reorganise feed URLs occasionally.
  - name: "Economic Times"
    url: "https://economictimes.indiatimes.com/rssfeedstopstories.cms"
    tier: 1
  - name: "Business Standard"
    url: "https://www.business-standard.com/rss/latest.rss"
    tier: 1
  - name: "Mint"
    url: "https://www.livemint.com/rss/news"
    tier: 1
  - name: "BusinessLine"
    url: "https://www.thehindubusinessline.com/feeder/default.rss"
    tier: 1
  - name: "Financial Express"
    url: "https://www.financialexpress.com/feed/"
    tier: 2
  - name: "Business Today"
    url: "https://www.businesstoday.in/rssfeeds/?id=225346"
    tier: 2

# The four paywalled sources have no public full-text RSS. As a free
# workaround we pull their headline + snippet via Google News RSS search
# (a public feed of headlines/snippets + outbound links -- this does not
# scrape the paywalled article itself).
google_news_topics:
  - name: "WSJ"
    query: "site:wsj.com business"
  - name: "Financial Times"
    query: "site:ft.com"
  - name: "Nikkei Asia"
    query: "site:asia.nikkei.com"
  - name: "Bloomberg Businessweek"
    query: "site:bloomberg.com businessweek"
  - name: "Il Sole 24 Ore"
    query: "site:ilsole24ore.com"

# Video 2 -- world news. Tagged by region so the script covers 10 of each
# rather than whichever group happens to score higher.
world:
  per_region: 10
  max_age_hours: 36
  feeds:
    - name: "Reuters World"
      url: "https://news.google.com/rss/search?q=when:1d+site:reuters.com+world&hl=en-IN&gl=IN&ceid=IN:en"
      region: global
    - name: "AP World"
      url: "https://news.google.com/rss/search?q=when:1d+site:apnews.com&hl=en-IN&gl=IN&ceid=IN:en"
      region: global
    - name: "BBC World"
      url: "https://feeds.bbci.co.uk/news/world/rss.xml"
      region: global
    - name: "Al Jazeera"
      url: "https://www.aljazeera.com/xml/rss/all.xml"
      region: global
    - name: "Guardian World"
      url: "https://www.theguardian.com/world/rss"
      region: global
    - name: "CNBC Economy"
      url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258"
      region: global
    - name: "Economic Times"
      url: "https://economictimes.indiatimes.com/rssfeedstopstories.cms"
      region: india
    - name: "Mint"
      url: "https://www.livemint.com/rss/news"
      region: india
    - name: "Business Standard"
      url: "https://www.business-standard.com/rss/latest.rss"
      region: india
    - name: "The Hindu National"
      url: "https://www.thehindu.com/news/national/feeder/default.rss"
      region: india
    - name: "NDTV India"
      url: "https://feeds.feedburner.com/ndtvnews-india-news"
      region: india

scoring:
  weights:
    cxo_relevance: 0.40
    career_relevance: 0.25
    source_recency: 0.20
    category_fit: 0.15
  cxo_keywords:
    ["ceo","cfo","coo","board","ipo","merger","acquisition","funding","valuation",
     "earnings","guidance","interest rate","inflation","rbi","fed","reserve bank",
     "regulation","market share","layoffs","capex","revenue","profit","stake",
     "investment","tariff","gdp","monetary policy","sebi"]
  career_keywords:
    ["ai","artificial intelligence","data","analytics","machine learning",
     "automation","algorithm","digital transformation","llm","generative ai",
     "data science","cloud","saas"]
  max_age_hours: 30
  shortlist_size: 20

episode:
  # Targets a ~12-18 min business briefing. Groq's free tier caps requests
  # at 8000 tokens per minute, so a longer script can't be generated in one
  # call -- raising this much above ~2600 gets truncated mid-sentence.
  target_word_count: 2200
  # Videos 2 and 3 are shorter: world news and two 3-minute explainers.
  extra_word_count: 1800
  # Kokoro voices. af_heart (A) and af_bella (A-) are its highest-rated,
  # chosen for word clarity. af_nova / af_sarah are the next clearest.
  host_a_voice: "af_heart"
  host_b_voice: "af_bella"
  tts_speed: 0.95
  # Delete episodes older than this. 3 videos/day at ~6 MB each means the
  # live site holds about 270 MB at 15 days, well inside GitHub's limits.
  keep_days: 15

page:
  # No email, no SMTP secrets. The pipeline publishes a page to
  # GitHub Pages instead -- visit it whenever you like.
  title: "CXO Business Briefing"
